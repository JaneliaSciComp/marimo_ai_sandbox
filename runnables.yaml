name: Marimo AI Sandbox
description: >-
  Marimo notebook server with AI coding-agent CLIs, in a read-only
  Apptainer/Podman sandbox.
requirements:
  - apptainer
  - pixi
runnables:
  - id: marimo
    name: Start Marimo Server (Apptainer)
    type: service
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    working_dir: repo
    description: >-
      Fileglancer's standard per-job security (access token in the URL), no
      extra TLS layer of its own -- see "marimo-https" for end-to-end
      encryption instead. Uses Apptainer if available, else Podman -- see
      "marimo-podman" to force Podman.
    pre_run: >-
      [ -n "${FG_PHASE_PATH:-}" ] && printf pulling_image > "$FG_PHASE_PATH" || true
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" pixi run marimo-apptainer --port "$FG_SERVICE_PORT"
    parameters:
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
      - flag: --ro-path-1
        name: Read-only path 1
        type: directory
        required: false
        exists: true
        description: >-
          A host directory to bind read-only into the sandbox. Must be a leaf
          path (e.g. /groups/scicompsoft), not a bare autofs parent (/groups,
          /nrs, /scratch). Combined with "Read-only path 2/3" and "Read-only
          paths" below, if given.
      - flag: --ro-path-2
        name: Read-only path 2
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-path-3
        name: Read-only path 3
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-paths
        name: Read-only paths (advanced)
        type: string
        required: false
        description: >-
          Space-separated host paths bound read-only into the sandbox, for
          more than 3 paths or when scripting -- same leaf-path rule as
          "Read-only path 1" above. Combined with any "Read-only path"
          slots above, if given. Defaults to conf/config.toml when none of
          these read-only path parameters are given.
      - flag: --allow
        name: Allowed egress hosts
        type: string
        required: false
        description: >-
          Space-separated hostnames to allow through the opt-in network
          egress allowlist (see README.md's "Sandbox strength" section).
          Leave unset for the default, unrestricted egress.
      - flag: --keep-id
        name: Run as your real identity (Podman only)
        type: boolean
        required: false
        description: >-
          Podman only: run the container as your real host uid/gid instead
          of root-mapped-through-the-user-namespace. No effect if this ends
          up using Apptainer, which already runs as your real identity by
          default. Requires an /etc/subuid//etc/subgid range for your
          account (ask HPC -- see README.md's "Podman Build" section);
          Podman errors out plainly if you don't have one.
    resources:
      cpus: 2
      walltime: "08:00"

  - id: marimo-podman
    name: Start Marimo Server (Podman)
    type: service
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    working_dir: repo
    description: >-
      Same as "marimo", but forces the Podman backend -- preferred by
      Janelia HPC admins (see README.md).
    pre_run: >-
      [ -n "${FG_PHASE_PATH:-}" ] && printf pulling_image > "$FG_PHASE_PATH" || true
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" pixi run marimo-podman --port "$FG_SERVICE_PORT"
    parameters:
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
      - flag: --ro-path-1
        name: Read-only path 1
        type: directory
        required: false
        exists: true
        description: >-
          A host directory to bind read-only into the sandbox. Must be a leaf
          path (e.g. /groups/scicompsoft), not a bare autofs parent (/groups,
          /nrs, /scratch). Combined with "Read-only path 2/3" and "Read-only
          paths" below, if given.
      - flag: --ro-path-2
        name: Read-only path 2
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-path-3
        name: Read-only path 3
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-paths
        name: Read-only paths (advanced)
        type: string
        required: false
        description: >-
          Space-separated host paths bound read-only into the sandbox, for
          more than 3 paths or when scripting -- same leaf-path rule as
          "Read-only path 1" above. Combined with any "Read-only path"
          slots above, if given. Defaults to conf/config.toml when none of
          these read-only path parameters are given.
      - flag: --allow
        name: Allowed egress hosts
        type: string
        required: false
        description: >-
          Space-separated hostnames to allow through the opt-in network
          egress allowlist (see README.md's "Sandbox strength" section).
          Leave unset for the default, unrestricted egress.
      - flag: --keep-id
        name: Run as your real identity
        type: boolean
        required: false
        description: >-
          Run the container as your real host uid/gid instead of
          root-mapped-through-the-user-namespace. Requires an
          /etc/subuid//etc/subgid range for your account (ask HPC -- see
          README.md's "Podman Build" section); Podman errors out plainly if
          you don't have one.
    resources:
      cpus: 2
      walltime: "08:00"

  - id: marimo-https
    name: Start Marimo Server (Apptainer, HTTPS)
    type: service
    service_proxy: false
    working_dir: repo
    description: >-
      End-to-end encryption straight to the compute node via a local Caddy
      TLS proxy -- self-signed by default, or a trusted cert if
      personal-certificate-authority (`pca`) is installed. Opts out of
      Fileglancer's own HTTPS proxy (service_proxy: false), since this job
      already terminates its own TLS. Uses Apptainer if available, else
      Podman -- see "marimo-podman-https" to force Podman. See README.md's
      "HTTPS" section for details.
    pre_run: >-
      [ -n "${FG_PHASE_PATH:-}" ] && printf pulling_image > "$FG_PHASE_PATH" || true
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" pixi run --environment https
      container/https-wrap.sh --port "$FG_SERVICE_PORT"
    parameters:
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
      - flag: --ro-path-1
        name: Read-only path 1
        type: directory
        required: false
        exists: true
        description: >-
          A host directory to bind read-only into the sandbox. Must be a leaf
          path (e.g. /groups/scicompsoft), not a bare autofs parent (/groups,
          /nrs, /scratch). Combined with "Read-only path 2/3" and "Read-only
          paths" below, if given.
      - flag: --ro-path-2
        name: Read-only path 2
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-path-3
        name: Read-only path 3
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-paths
        name: Read-only paths (advanced)
        type: string
        required: false
        description: >-
          Space-separated host paths bound read-only into the sandbox, for
          more than 3 paths or when scripting -- same leaf-path rule as
          "Read-only path 1" above. Combined with any "Read-only path"
          slots above, if given. Defaults to conf/config.toml when none of
          these read-only path parameters are given.
      - flag: --https-port
        name: HTTPS port
        type: integer
        required: false
        description: >-
          Public TLS port Caddy listens on. Defaults to an arbitrary free
          port chosen automatically at start.
      - flag: --keep-id
        name: Run as your real identity (Podman only)
        type: boolean
        required: false
        description: >-
          Podman only: run the container as your real host uid/gid instead
          of root-mapped-through-the-user-namespace. No effect if this ends
          up using Apptainer, which already runs as your real identity by
          default. Requires an /etc/subuid//etc/subgid range for your
          account (ask HPC -- see README.md's "Podman Build" section);
          Podman errors out plainly if you don't have one.
    resources:
      cpus: 2
      walltime: "08:00"

  - id: marimo-podman-https
    name: Start Marimo Server (Podman, HTTPS)
    type: service
    service_proxy: false
    working_dir: repo
    description: >-
      Same as "marimo-https", but forces the Podman backend -- preferred by
      Janelia HPC admins (see README.md).
    pre_run: >-
      [ -n "${FG_PHASE_PATH:-}" ] && printf pulling_image > "$FG_PHASE_PATH" || true
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" BACKEND=podman pixi run --environment https
      container/https-wrap.sh --port "$FG_SERVICE_PORT"
    parameters:
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
      - flag: --ro-path-1
        name: Read-only path 1
        type: directory
        required: false
        exists: true
        description: >-
          A host directory to bind read-only into the sandbox. Must be a leaf
          path (e.g. /groups/scicompsoft), not a bare autofs parent (/groups,
          /nrs, /scratch). Combined with "Read-only path 2/3" and "Read-only
          paths" below, if given.
      - flag: --ro-path-2
        name: Read-only path 2
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-path-3
        name: Read-only path 3
        type: directory
        required: false
        exists: true
        description: Same as "Read-only path 1", another optional slot.
      - flag: --ro-paths
        name: Read-only paths (advanced)
        type: string
        required: false
        description: >-
          Space-separated host paths bound read-only into the sandbox, for
          more than 3 paths or when scripting -- same leaf-path rule as
          "Read-only path 1" above. Combined with any "Read-only path"
          slots above, if given. Defaults to conf/config.toml when none of
          these read-only path parameters are given.
      - flag: --https-port
        name: HTTPS port
        type: integer
        required: false
        description: >-
          Public TLS port Caddy listens on. Defaults to an arbitrary free
          port chosen automatically at start.
      - flag: --keep-id
        name: Run as your real identity (Podman only)
        type: boolean
        required: false
        description: >-
          Podman only: run the container as your real host uid/gid instead
          of root-mapped-through-the-user-namespace. No effect if this ends
          up using Apptainer, which already runs as your real identity by
          default. Requires an /etc/subuid//etc/subgid range for your
          account (ask HPC -- see README.md's "Podman Build" section);
          Podman errors out plainly if you don't have one.
    resources:
      cpus: 2
      walltime: "08:00"

