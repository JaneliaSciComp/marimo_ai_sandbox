name: Marimo AI Sandbox
description: >-
  Reactive Marimo notebook server bundled with AI coding-agent CLIs (Claude
  Code, Codex, Gemini, Antigravity) inside a read-only Apptainer/Podman
  sandbox; only a single work directory is writable.
requirements:
  - apptainer
  - pixi
runnables:
  - id: marimo
    name: Start Marimo Server
    type: service
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    working_dir: repo
    description: >-
      Serves the Marimo notebook server. The host filesystem is mounted
      read-only except for the work directory, which holds notebooks and
      agent config/cache. Pulls the pre-built image published by
      .github/workflows/publish-image.yml (ghcr.io/janeliascicomp/marimo_ai_sandbox)
      instead of building from source; falls back to a local build only if
      the pull fails and no local image exists yet.
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" pixi run marimo-apptainer
      --port "$FG_SERVICE_PORT" --token-password "$FG_SERVICE_TOKEN"
    parameters:
      - flag: --ro-paths
        name: Read-only paths
        type: string
        description: >-
          Space-separated host paths bound read-only into the sandbox. Must
          be leaf paths (e.g. /groups/scicompsoft), not bare autofs parents
          (/groups, /nrs, /scratch). Defaults to conf/config.toml.
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
    resources:
      cpus: 2
      memory: "8 GB"
      walltime: "08:00"

  - id: marimo-https
    name: Start Marimo Server (HTTPS)
    type: service
    working_dir: repo
    description: >-
      Serves the Marimo notebook server behind a local Caddy TLS-terminating
      reverse proxy. On first run, the wrapper script (container/https-wrap.sh)
      generates a persistent self-signed cert with openssl and prints its path
      -- install it in your browser's trust store to avoid the
      untrusted-certificate warning. Because this is a manual (non-auto_url)
      service, Fileglancer injects SERVICE_URL_PATH, FG_PHASE_PATH,
      FG_HOSTNAME, and FG_WORK_DIR automatically for every service-type job;
      no env: block is needed to request them. The wrapper script uses these
      to publish the service URL itself once Caddy's HTTPS port is open
      (rather than using Fileglancer's auto_url, which would point at
      Marimo's own plain-HTTP port instead of Caddy's HTTPS one). If the
      launch link never appears, check this job's Error Log first -- the
      wrapper now logs explicitly if SERVICE_URL_PATH is unset, or if Marimo
      or Caddy died before the HTTPS port opened. Runs Marimo itself via
      apptainer if available on the host, otherwise falls back to Podman --
      same fallback as the plain "marimo" pixi task. Both pull the pre-built
      image from ghcr.io/janeliascicomp/marimo_ai_sandbox rather than
      building from source (see the "marimo" runnable above).
    command: >-
      PATH="$HOME/.pixi/bin:$PATH" pixi run --environment https
      container/https-wrap.sh --port "$FG_SERVICE_PORT"
    parameters:
      - flag: --ro-paths
        name: Read-only paths
        type: string
        description: >-
          Space-separated host paths bound read-only into the sandbox. Must
          be leaf paths (e.g. /groups/scicompsoft), not bare autofs parents
          (/groups, /nrs, /scratch). Defaults to conf/config.toml.
      - flag: --work
        name: Work directory
        type: directory
        exists: false
        description: >-
          Writable host directory bound to /work inside the sandbox. Defaults
          to ./work.
      - flag: --https-port
        name: HTTPS port
        type: integer
        required: false
        description: >-
          Public TLS port Caddy listens on. Defaults to an arbitrary free
          port chosen automatically at start.
    resources:
      cpus: 2
      memory: "8 GB"
      walltime: "08:00"

  - id: marimo-native
    name: Start Marimo Server (native container, experimental)
    type: service
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    working_dir: work
    description: >-
      Experimental: uses Fileglancer's built-in Apptainer container launch
      (the manifest's container/container_args/bind_paths fields) instead of
      this repo's container/{apptainer,podman}/marimo.sh wrapper scripts, to
      compare against the "marimo" runnable above. Known gaps versus that
      wrapper-script approach: no dynamic --ro-paths validation (autofs-parent
      rejection), no GPU detection, no bsub support, and no curated env-var
      allowlist -- bind_paths below is static. Unverified until tested: does
      Fileglancer forward FG_SERVICE_TOKEN/FG_SERVICE_PORT into the
      container's environment automatically, and does bind_paths support
      parameter substitution.
    container: docker://ghcr.io/janeliascicomp/marimo_ai_sandbox:latest
    container_args: "--contain --cleanenv --pid"
    bind_paths:
      - "./work:/work"
    command: >-
      --port "$FG_SERVICE_PORT" --token-password "$FG_SERVICE_TOKEN"
    resources:
      cpus: 2
      memory: "8 GB"
      walltime: "08:00"
